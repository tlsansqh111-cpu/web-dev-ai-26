<html>
  lang="en"
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>이미지 태그</h2>
    <!-- alt : 이미지가 꺠질 떄 대체 텍스트
     width / height : 이미지 크기 지정 
     loading="lazy" : 스크롤해야 보이는 이미지를 늦게 로딩
-->
    <img
      src="assets/panda.jpg"
      alt="판다"
      width="300"
      height="300"
      loading="lazy"
    />
    <img src="assets/panda.jpg" alt="판다" width="300" />

    <h2>오디오 태그</h2>
    <!-- controls : 재생 컨트롤 표시, loop : 반복 재생 -->
    <audio src="./assets/audio.mp4" controls loop></audio>

    <h2>비디오 태그</h2>
    <!-- controls : 재생 컨트롤 표시, poster : 썸네일 이미지 -->
    <video src="./assets/thumbnail.png"></video>
    <h2>외부 프레임</h2>
    src=""" alt="판다" width="300" height="300" totle
  </body>
</html>
<!doctype html>
