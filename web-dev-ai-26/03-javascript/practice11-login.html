<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 및 프로필</title>
    <link rel="stylesheet" href="./practice11-login.css">
</head>
<body>
    <div class="page1">
        <div id="login-container" class="card loginpage">
            <h1>로그인</h1>
            <form id="login-form">
                <input type="text" id="username" placeholder="아이디를 입력해주세요">
                <input type="password" id="password" placeholder="비밀번호를 입력해주세요">
                <button type="submit" id="login-btn" class="btn-blue">로그인</button>
            </form>
            <div class="links">계정이 없으신가요? </div>
            <button id="click">회원 가입</button>        
        </div>
    </div>

    <div id="page2-container" class="card hidden">
        <h2 class="welcome">님 환영합니다!</h2>
        <div class="info">
            <h4>이메일</h4>
            <p id="display-email">admin@google.com</p>
            
            <h4>전화번호</h4>
            <p id="display-phone">010-1234-5678</p>
        </div>
        <div class="profile-btns">
            <button id="logoutclick">로그아웃</button>
            <button id="drawclick">회원탈퇴</button>
        </div>
    </div>

    <script src="./practice11-login.js"></script>
</body>
</html>
