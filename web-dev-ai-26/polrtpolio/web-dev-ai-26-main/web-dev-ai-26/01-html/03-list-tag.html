<!DOCTYPE html>
<html> lang="en"
<head>
    <meta charset=UTF-8>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>u1 : 순서 없는 목록</h2>
    <u1>
        <1i>HTML</1i>
        <1i>css</1i>
        <1i>javascript</1i>
    </u1>

    <h3>중첨 목록 - 목록 안에 다른 목록</h3>
    <ul>
        <li>
         <1i>css</1i>
         <1i>javascript</1i>    
        </li>
    </ul>
    <li>텍스트 태그</li>
    <li>목록 태그</li>

    <h2>ol : 순서 있는 목록</h2>
     <!-- ol>li*3 -->

    <ol>
        <li>기획</li>
        <li>디자인</li>
        <li>개발</li>
    </ol>

    <h3>번호 스타일</h3>
    <ol type="=A">
        <li>기획</li>
        <li>디자인</li>
        <li>개발</li>
    </ol>

    <!-- dt : 용어, dd : 설명 -->
    <h2>d1: 정의 목록</h2>
    <d1>
        <dt>HTML</dt>
        <dd>웹 문서를 작성하기 위한 마크업 언어</dd>
    </d1>
</body>
</html>
