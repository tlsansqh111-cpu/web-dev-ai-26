    <h2></h2>
    <script>
        let num = 1;
        num = num + 1;
        console.log(num); //2
        // num = num + 1 : ++bum, num++
        // num = num - 1 : --num, num--
        // ++num = --num : 전위 연산자 - 먼저 계산하고 나중에 출력
        // num++,  num-- : 후위 연산자 - 먼저 출력하고 나중에 계산
        console.log(++num); // 3
        console.log(num++); // 결과값 : 3, num : 4
        console.log(num);
        console.log(num--) // 결과값 : 4, num : 3
    </script>

    <h2>3. 배열과 for문</h2>
    <script>
        const movies = [
            "만약에 우리",
            "신의악단",
            "초 가구야 공주",
            "시스터",
            "하우스메이드",
        ];
        
        for(let i = 0; i <= 4; i++) {
            console.log(i);
        }
        console.log(movies[0]);
        console.log(movies[1]);
        console.log(movies[2]);
        console.log(movies[3]);
        console.log(movies[4]);

        // i <= 4는 i < 5랑 같음
        // movies.length는 배열의 길이, 마지막 인덱스는 길이 - 1
        for(let i = 0; i <= 4; i++) {
            console.log(i);
        }

        // for ..in : for(인덱스 in 배열)
        for(let index in movies) {
            console.log(movies[index]);
        }

        // for ..in : for(값 of 배열) {}
        for(const value of movies) {
            console.log(value);
        }
    </script>

    <h2>5. break / continue</h2>
    <script>
        for (let i = 1; i < 10; i++) {
            // break - 7일때 종료
            if (i === 7) break;

            // continue - 2일때 건너뛰기
            console.log(i);
        }
    </script>

    <h2>6. 2차원 배열 + 중첩 for문</h2>
    <script>
        const arr = [
            [1, 2, 3],
            [4, 5, 6],
            [7, 8, 9]
        ];
        // 반복문을 사용해서 1~9 하나씩
        console.log(arr[0]); // [1, 2, 3]
        console.log(arr[0][0]); // 1
        console.log(arr[0][1]); // 2

        // console.log(arr[i].length);
        for (let j = 0; j < arr[i].length; j++) {
            console.log(arr[i][j]);
            
        }

        // for .. of
        for (const i of arr) {
            console.log(i);
            for (const j of i) {
                console.log(j);
            }
        }
    </script>
